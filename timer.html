<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tabata 計時器</title>
        <link href="styles/timer.css" rel="stylesheet" type="text/css">
    </head>
    <body>
        <div class="container">
        <div id="status" class="status">準備開始</div>
        <div id="timer" class="timer-display">00</div>
        <div id="round-display" style="margin-bottom: 20px;">回合: 0 / 8</div>

        <div class="settings">
            <div class="input-group">
                <label>運動 (秒)</label>
                <input type="number" id="workTime" value="20">
            </div>
            <div class="input-group">
                <label>休息 (秒)</label>
                <input type="number" id="restTime" value="10">
            </div>
            <div class="input-group" style="grid-column: span 2;">
                <label>總回合數</label>
                <input type="number" id="totalRounds" value="8">
            </div>
        </div>

        <div class="controls">
            <button class="btn-start" id="startBtn">開始訓練</button>
            <button class="btn-reset" id="resetBtn">重設</button>
        </div>
    </div>

    <script src="scripts/timer.js"></script>
    </body>
</html>
