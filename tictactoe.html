<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圈圈叉叉遊戲</title>
    <style>
        body { font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f0f2f5; margin: 0; padding: 20px; }
        h1 { color: #333; }
        .status { margin-bottom: 20px; font-size: 1.2rem; font-weight: bold; color: #555; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); grid-template-rows: repeat(3, 100px); gap: 10px; background-color: #333; border: 10px solid #333; border-radius: 10px; }
        .cell { width: 100px; height: 100px; background-color: #fff; display: flex; align-items: center; justify-content: center; font-size: 3rem; cursor: pointer; transition: background-color 0.3s; }
        .cell:hover { background-color: #e9ecef; }
        .cell.taken { cursor: not-allowed; }
        .cell.winner { background-color: #d4edda; color: #155724; }
        button { margin-top: 30px; padding: 10px 25px; font-size: 1rem; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        button:hover { background-color: #0056b3; }
        .player-o { color: #e74c3c; }
        .player-x { color: #3498db; }
    </style>
</head>
<body>

    <h1>圈圈叉叉</h1>
    <div class="status" id="status">輪到玩家：O</div>
    
    <div class="board" id="board">
        <div class="cell" onclick="makeMove(this, 0)"></div>
        <div class="cell" onclick="makeMove(this, 1)"></div>
        <div class="cell" onclick="makeMove(this, 2)"></div>
        <div class="cell" onclick="makeMove(this, 3)"></div>
        <div class="cell" onclick="makeMove(this, 4)"></div>
        <div class="cell" onclick="makeMove(this, 5)"></div>
        <div class="cell" onclick="makeMove(this, 6)"></div>
        <div class="cell" onclick="makeMove(this, 7)"></div>
        <div class="cell" onclick="makeMove(this, 8)"></div>
    </div>

    <button onclick="resetGame()">重新開始</button>

    <script>
        let currentPlayer = 'O'; // O 先開始
        let gameState = ["", "", "", "", "", "", "", "", ""]; // 記錄棋盤狀態
        let gameActive = true;
        const statusDisplay = document.getElementById('status');
        const cells = document.querySelectorAll('.cell');

        // 贏球的組合索引
        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // 橫
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // 直
            [0, 4, 8], [2, 4, 6]             // 斜
        ];

        function makeMove(cell, index) {
            // 如果格子已被佔據或遊戲已結束，則不執行
            if (gameState[index] !== "" || !gameActive) return;

            // 更新內部狀態與介面
            gameState[index] = currentPlayer;
            cell.textContent = currentPlayer;
            cell.classList.add('taken');
            cell.classList.add(currentPlayer === 'O' ? 'player-o' : 'player-x');

            checkResult();
        }

        function checkResult() {
            let roundWon = false;
            let winningLine = [];

            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (gameState[a] && gameState[a] === gameState[b] && gameState[a] === gameState[c]) {
                    roundWon = true;
                    winningLine = [a, b, c];
                    break;
                }
            }

            if (roundWon) {
                statusDisplay.textContent = `玩家 ${currentPlayer} 贏了！`;
                statusDisplay.style.color = "#28a745";
                winningLine.forEach(idx => cells[idx].classList.add('winner'));
                gameActive = false;
                return;
            }

            // 檢查是否平手
            if (!gameState.includes("")) {
                statusDisplay.textContent = "雙方平手！";
                gameActive = false;
                return;
            }

            // 切換玩家
            currentPlayer = currentPlayer === 'O' ? 'X' : 'O';
            statusDisplay.textContent = `輪到玩家：${currentPlayer}`;
        }

        function resetGame() {
            currentPlayer = 'O';
            gameState = ["", "", "", "", "", "", "", "", ""];
            gameActive = true;
            statusDisplay.textContent = `輪到玩家：O`;
            statusDisplay.style.color = "#555";
            cells.forEach(cell => {
                cell.textContent = "";
                cell.className = "cell";
            });
        }
    </script>
</body>
</html>
