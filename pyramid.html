<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旋轉三角錐</title>
    <style>
        /* 設置背景與置中 */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
            overflow: hidden;
            perspective: 800px; /* 設置透視距離，產生立體感 */
        }

        /* 三角錐容器 */
        .pyramid {
            position: relative;
            width: 200px;
            height: 200px;
            transform-style: preserve-3d; /* 保留 3D 空間 */
            animation: rotatePyramid 8s infinite linear; /* 循環旋轉動畫 */
        }

        /* 定義旋轉動畫 */
        @keyframes rotatePyramid {
            from { transform: rotateY(0deg) rotateX(30deg); }
            to { transform: rotateY(360deg) rotateX(30deg); }
        }

        /* 面的共通樣式 */
        .face {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            border-bottom: 173.2px solid rgba(0, 255, 200, 0.7); /* 三角形高度約為 底邊 * sin(60) */
            filter: drop-shadow(0 0 10px rgba(0, 255, 200, 0.5));
        }

        /* 各個面的位置與旋轉角度 */
        /* 正面 */
        .face1 {
            /* transform: translateZ(58px); */
            /* transform: (19.5deg); */
            border-bottom-color: #4facfe;
        }
        /* 左後方 */
        .face2 {
            transform: rotateY(120deg);
            transform: translateZ(58px);
            transform: rotateX(19.5deg);
            border-bottom-color: #00f2fe;
        }
        /* 右後方 */
        .face3 {
            transform: rotateY(240deg) translateZ(58px) rotateX(19.5deg);
            border-bottom-color: #706fd3;
        }
        /* 底座 */
        .face4 {
            width: 200px;
            height: 173.2px;
            background-color: #333;
            border: none;
            transform: rotateX(-90deg) translateY(-58px);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

    </style>
</head>
<body>

    <div class="pyramid">
        <!-- <div class="face face1"></div> -->
        <!-- <div class="face face2"></div> -->
        <!-- <div class="face face3"></div> -->
        <!-- <div class="face face4"></div> -->
    </div>

</body>
</html>
